# Pushing a version tag publishes a release:
#
#   1. bump APP_VERSION in about.conf and add a "## <version>" section to
#      CHANGELOG.md, commit
#   2. git tag v2.0 && git push origin main v2.0
#
# The tag must match about.conf and the changelog must have a section for it,
# the whole test suite must pass, and only then are the .deb, .rpm and source
# tarball built and attached to a new GitHub release - each both under its
# versioned name and as backatit.deb / backatit.rpm / backatit.tar.gz, which
# the README links to so its download commands never go stale.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag matches about.conf
        run: |
          tag="${GITHUB_REF_NAME#v}"
          . ./about.conf
          if [ "$tag" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION=$APP_VERSION in about.conf"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG has a section for it
        run: |
          ./tools/changelog-section.sh "${{ steps.v.outputs.version }}" > notes.md
          echo "Release notes:"; cat notes.md

  test:
    name: Test suite
    needs: check
    uses: ./.github/workflows/tests.yml

  build:
    name: Build packages
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev fakeroot rpm
      - name: Build .deb, .rpm and source tarball
        run: |
          mkdir -p dist
          OUTDIR=dist ./build-deb.sh
          OUTDIR=dist ./build-rpm.sh
          OUTDIR=dist ./build-tarball.sh
          # The same files again under names without the version, so a link
          # to releases/latest/download/backatit.deb never goes stale.
          cp dist/backatit_*_all.deb       dist/backatit.deb
          cp dist/backatit-*.noarch.rpm    dist/backatit.rpm
          cp dist/backatit-*.tar.gz        dist/backatit.tar.gz
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ./tools/changelog-section.sh "$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "BackAtIt $VERSION" \
            --notes-file notes.md \
            --verify-tag
